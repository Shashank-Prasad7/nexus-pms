version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pms-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/pms_db?schema=public"
      JWT_SECRET: "super_secret_jwt_key_project_management_2026"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

volumes:
  postgres_data:
